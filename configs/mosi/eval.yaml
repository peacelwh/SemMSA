# Checkpoint used for each reported metric on MOSI (one best checkpoint per metric, selected at r = 0.5).
dataset: mosi
seeds: [1111, 1112, 1113]
metrics:
  Has0_acc_2: {config: acc2, checkpoint: Has0_acc_2}
  Has0_F1_score: {config: acc2, checkpoint: Has0_acc_2}
  Non0_acc_2: {config: acc2, checkpoint: Non0_acc_2}
  Non0_F1_score: {config: acc2, checkpoint: Non0_acc_2}
  Mult_acc_5: {config: acc5, checkpoint: Mult_acc_5}
  Mult_acc_7: {config: acc7, checkpoint: Mult_acc_7}
  MAE: {config: reg, checkpoint: MAE}
  Corr: {config: reg, checkpoint: MAE}
